openapi: 3.0.3
info:
  title: FH Development API
  description: Central backend API for the FH Development platform
  version: 1.0.0
  contact:
    name: FH Development
    url: https://fh-development.xyz
servers:
  - url: http://localhost:5000/api/v1
    description: Development
  - url: https://backend-mczn.onrender.com/api/v1
    description: Render (production)
  - url: https://api.fh-development.xyz/api/v1
    description: Custom domain

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: object
          properties:
            code:
              type: string
            details:
              type: object

paths:
  /health:
    get:
      summary: Basic health check
      tags: [System]
      parameters:
        - name: detailed
          in: query
          schema: { type: boolean }
          description: Include database and service checks
      responses:
        '200':
          description: API is operational
        '503':
          description: One or more services are down

  /heath:
    get:
      summary: Health check alias (typo-friendly)
      tags: [System]
      responses:
        '200':
          description: API is operational

  /api/v1/health:
    get:
      summary: Versioned health check
      tags: [System]
      responses:
        '200':
          description: API is operational

  /auth/register:
    post:
      summary: Register a new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: User registered

  /auth/login:
    post:
      summary: Login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Login successful

  /auth/me:
    get:
      summary: Get current user
      tags: [Authentication]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user profile

  /products:
    get:
      summary: List products
      tags: [Products]
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
        - name: published
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Product list

  /products/{slug}:
    get:
      summary: Get product by slug
      tags: [Products]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product details

  /downloads/{fileId}:
    post:
      summary: Request authenticated download
      tags: [Downloads]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Signed download URL

  /licenses:
    get:
      summary: List licenses (staff)
      tags: [Licensing]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: License list

  /licenses/activate:
    post:
      summary: Activate a license
      tags: [Licensing]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: License activated

  /support:
    get:
      summary: List support tickets
      tags: [Support]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Ticket list
    post:
      summary: Create support ticket
      tags: [Support]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Ticket created

  /contact:
    post:
      summary: Submit contact form
      tags: [Contact]
      responses:
        '201':
          description: Message received

  /search:
    get:
      summary: Global search
      tags: [Search]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Search results

  /analytics/overview:
    get:
      summary: Analytics overview
      tags: [Analytics]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Overview metrics

  /system/status:
    get:
      summary: System status
      tags: [System]
      responses:
        '200':
          description: Service health status

tags:
  - name: Authentication
  - name: Products
  - name: Downloads
  - name: Licensing
  - name: Support
  - name: Contact
  - name: Search
  - name: Analytics
  - name: System
