name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fh_development_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fh_development_test
      JWT_ACCESS_SECRET: ci-access-secret-please-change-1234567890
      JWT_REFRESH_SECRET: ci-refresh-secret-please-change-1234567890
      API_BASE_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
      VAULT_ENABLED: "false"
      STORAGE_USE_LOCAL: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fh_development_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fh_development_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Apply test schema
        run: npx prisma db push --skip-generate
      - name: Run tests
        run: npm test -- --ci
